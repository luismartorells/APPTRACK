<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hierro">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Diario de Hierro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: app de una columna para iPhone, cabecera fija arriba y barra de pestañas abajo. Colores de datos = colores de discos olímpicos (rojo 25, amarillo 15, azul 20, verde 10). */
:root{
  --bg:#ECEEEA; --surface:#FFFFFF; --sunk:#F4F5F2; --ink:#17201C; --muted:#5E6A64; --line:#D5DAD4;
  --iron:#1F2A25; --on-iron:#F3F5F2;
  --red:#C3322B; --yellow:#C9940F; --blue:#2453A3; --green:#2C8649;
  --red-soft:#F6E1DF; --green-soft:#DDEFE2; --yellow-soft:#F6EBCF;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111513; --surface:#1A1F1C; --sunk:#151917; --ink:#E7ECE8; --muted:#94A19A; --line:#2B332F;
  --iron:#E7ECE8; --on-iron:#141816;
  --red:#E35A52; --yellow:#E2B23E; --blue:#6A95E0; --green:#56B774;
  --red-soft:#3A1F1D; --green-soft:#1C3324; --yellow-soft:#382E14; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#111513; --surface:#1A1F1C; --sunk:#151917; --ink:#E7ECE8; --muted:#94A19A; --line:#2B332F;
  --iron:#E7ECE8; --on-iron:#141816;
  --red:#E35A52; --yellow:#E2B23E; --blue:#6A95E0; --green:#56B774;
  --red-soft:#3A1F1D; --green-soft:#1C3324; --yellow-soft:#382E14; color-scheme:dark;}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px)}
html,body{background:var(--bg);color:var(--ink);margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
#app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;letter-spacing:.01em}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em}
.lbl{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}

/* cabecera */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.brand i{display:inline-block;width:22px;height:8px;border-radius:2px;background:var(--iron);position:relative}
.brand i::before,.brand i::after{content:"";position:absolute;top:-5px;width:5px;height:18px;border-radius:2px;background:var(--red)}
.brand i::before{left:-3px}.brand i::after{right:-3px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync b{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok b{background:var(--green)}.sync.err b{background:var(--red)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;flex:none}
.iconbtn svg{width:18px;height:18px}
.datenav{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:14px 4px}
.datenav h2{font-size:24px;text-transform:capitalize}
.datenav .sub{font-size:13px;color:var(--muted)}

/* pestañas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{background:none;border:0;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"] svg{color:var(--red)}

/* bloques */
.stack{display:flex;flex-direction:column;gap:14px;padding-top:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card h3{font-size:19px;text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.hr{height:1px;background:var(--line);margin-block:12px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;display:inline-flex;align-items:center;gap:7px;justify-content:center;min-height:42px}
.btn.primary{background:var(--iron);color:var(--on-iron);border-color:var(--iron)}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:6px 11px;font-size:14px}
.btn svg{width:18px;height:18px}
.btn[disabled]{opacity:.5;cursor:default}
.x{border:0;background:none;color:var(--muted);width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:none}
.x:hover{background:var(--sunk)}
.x svg{width:16px;height:16px}

input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;min-width:0;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:9px 11px;min-height:42px;font-size:16px}
textarea{resize:vertical;min-height:64px;line-height:1.4}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:-1px;background:var(--surface)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

/* nutrición */
.hero{background:var(--iron);color:var(--on-iron);border:0}
.hero .lbl{color:color-mix(in srgb,var(--on-iron) 65%,transparent)}
.big{font-family:var(--display);font-weight:700;font-size:60px;line-height:.95;font-variant-numeric:tabular-nums}
.big small{font-size:22px;font-weight:600;margin-left:4px;opacity:.75}
.eq{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:14px;color:color-mix(in srgb,var(--on-iron) 80%,transparent)}
.eq b{font-family:var(--display);font-size:18px;color:var(--on-iron);font-weight:600}
.goalbar{margin-top:14px;height:10px;border-radius:5px;background:color-mix(in srgb,var(--on-iron) 18%,transparent);position:relative;overflow:hidden}
.goalbar span{position:absolute;inset:0 auto 0 0;background:var(--green);border-radius:5px}
.goalbar span.over{background:var(--red)}
.goalnote{margin-top:8px;font-size:14px}

.macro{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:6px 10px}
.plate{width:14px;height:14px;border-radius:50%;border:3px solid currentColor;flex:none}
.bar{height:8px;border-radius:4px;background:var(--sunk);border:1px solid var(--line);overflow:hidden;grid-column:1/-1}
.bar span{display:block;height:100%;border-radius:4px}
.mval{font-family:var(--display);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.mval small{font-size:14px;color:var(--muted);font-weight:500}

.water{display:flex;align-items:flex-end;gap:5px;flex-wrap:wrap;margin-block:10px}
.glass{width:20px;height:28px;border:2px solid var(--blue);border-top-width:1px;border-radius:2px 2px 5px 5px;position:relative;overflow:hidden;opacity:.9}
.glass.full::after{content:"";position:absolute;inset:30% 0 0 0;background:var(--blue);opacity:.75}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:500;text-align:left;max-width:100%;display:inline-flex;gap:6px;align-items:baseline}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip em{font-style:normal;color:var(--muted);font-size:12.5px;white-space:nowrap}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:10px;padding-block:10px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .name{font-weight:600;overflow-wrap:anywhere}
.item .meta{font-size:13px;color:var(--muted)}
.kc{font-family:var(--display);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}

/* gimnasio */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px}
.wd{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 0 8px;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
.wd b{font-family:var(--display);font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.06em}
.wd span{font-family:var(--display);font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
.wd.today b{color:var(--red)}
.wd[aria-pressed="true"]{background:var(--iron);border-color:var(--iron);color:var(--on-iron)}
.wd[aria-pressed="true"] b{color:color-mix(in srgb,var(--on-iron) 70%,transparent)}
.wd i{position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--green)}
.dayhead h2{font-size:28px;text-transform:uppercase;letter-spacing:.03em}
.ex .head{display:flex;gap:10px;align-items:flex-start}
.ex h4{margin:0;font-size:17px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.target{font-family:var(--display);font-weight:700;font-size:16px;border:2px solid var(--iron);border-radius:8px;padding:1px 8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.hint{font-size:13px;color:var(--muted);margin-top:2px}
.last{margin-top:10px;background:var(--sunk);border:1px dashed var(--line);border-radius:10px;padding:8px 10px;font-size:13.5px}
.last b{font-family:var(--display);font-size:16px;font-weight:600}
.last .note{margin-top:4px;color:var(--red)}
.sets{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.set{display:grid;grid-template-columns:28px 1fr 1fr 32px;gap:8px;align-items:center}
.set.one{grid-template-columns:28px 1fr 32px}
.set .n{font-family:var(--display);font-weight:700;font-size:17px;color:var(--muted);text-align:center}
.set label{position:relative;display:block}
.set label em{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-style:normal;font-size:12px;color:var(--muted);pointer-events:none}
.set input{padding-right:42px;text-align:left;font-family:var(--display);font-size:19px;font-weight:600}
.better{color:var(--green)}.worse{color:var(--red)}
.notebox{margin-top:10px}
.notebox textarea{min-height:44px}
.banner{background:var(--yellow-soft);border:1px solid color-mix(in srgb,var(--yellow) 45%,transparent)}
.sw{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.sw > div{border-radius:12px;padding:12px;min-width:0}
.sw .s{background:var(--green-soft)}.sw .w{background:var(--red-soft)}
.sw .pct{font-family:var(--display);font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.sw .s .pct{color:var(--green)}.sw .w .pct{color:var(--red)}
.sw .nm{font-weight:600;margin-top:4px;overflow-wrap:anywhere}
.editrow{display:grid;grid-template-columns:1fr;gap:8px;padding-block:12px;border-top:1px solid var(--line)}
.editrow:first-of-type{border-top:0}
.editrow .mini{display:grid;grid-template-columns:70px 1fr 1fr;gap:8px}

/* progreso */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td,.tbl th{padding:9px 6px;border-top:1px solid var(--line);text-align:left;vertical-align:middle}
.tbl th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;border-top:0}
.tbl td.r,.tbl th.r{text-align:right}
.pctpill{font-family:var(--display);font-weight:700;font-size:16px;padding:1px 8px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pctpill.up{background:var(--green-soft);color:var(--green)}.pctpill.down{background:var(--red-soft);color:var(--red)}.pctpill.flat{background:var(--sunk);color:var(--muted)}
.scroll{overflow-x:auto}
.chart svg{width:100%;height:auto;display:block}
.notes .item{align-items:flex-start}

/* tareas */
.task{display:flex;align-items:center;gap:10px;padding-block:9px;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:var(--sunk);display:grid;place-items:center;flex:none}
.check svg{width:16px;height:16px;opacity:0}
.task.done .check{background:var(--green);border-color:var(--green);color:#fff}
.task.done .check svg{opacity:1}
.task.done .t{text-decoration:line-through;color:var(--muted)}
.t{overflow-wrap:anywhere}
.tag{font-size:12px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--red-soft);color:var(--red);white-space:nowrap}
.tag.n{background:var(--sunk);color:var(--muted)}

/* hoja modal */
.overlay{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,#000 45%,transparent);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet h3{font-size:22px;text-transform:uppercase;letter-spacing:.03em}
.status{font-size:13.5px;color:var(--muted);min-height:1em}
.status.err{color:var(--red)}
.empty{padding:20px 4px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--iron);color:var(--on-iron);padding:10px 14px;border-radius:12px;display:flex;gap:12px;align-items:center;font-size:14px;max-width:calc(100% - 32px)}
.toast button{background:none;border:0;color:var(--yellow);font-weight:700}
.scanbox{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:3/4;max-height:60vh;width:100%}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanbox .ret{position:absolute;left:10%;right:10%;top:38%;height:24%;border:3px solid #fff;border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.scanbox .ret::after{content:"";position:absolute;left:6%;right:6%;top:50%;height:2px;background:#E35A52;box-shadow:0 0 8px #E35A52}
.results .item{cursor:pointer}
.searchbtn{width:100%;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:11px 12px;color:var(--muted);font-size:16px;text-align:left;min-height:46px}
.searchbtn svg{width:18px;height:18px;flex:none}
.res{cursor:pointer;border-radius:10px}
.res:active{background:var(--sunk)}
.res .meta b{color:var(--ink);font-weight:600}
.qadd{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.qadd svg{width:18px;height:18px}
.reslbl{margin:12px 0 2px}
.src{font-size:11px;font-weight:600;padding:1px 6px;border-radius:999px;background:var(--sunk);color:var(--muted);margin-left:6px;vertical-align:1px}
@media (max-width:380px){.big{font-size:50px}.grid4{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:no-preference){.bar span,.goalbar span{transition:width .35s ease}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><i aria-hidden="true"></i>Diario de Hierro</div>
    <div class="sync" id="sync"><b></b><span>Cargando…</span></div>
    <button class="iconbtn" data-act="settings" aria-label="Ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </header>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="Secciones"><div class="in">
  <button data-act="tab" data-tab="nutri"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 21c-4.5 0-7-3.5-7-7.5S8 6 12 8c4-2 7 1.5 7 5.5S16.5 21 12 21z"/><path d="M12 8c0-2 1-4 3-5"/></svg>Nutrición</button>
  <button data-act="tab" data-tab="gym"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>Gimnasio</button>
  <button data-act="tab" data-tab="prog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 20h18"/><path d="M5 16l4-5 4 3 6-8"/><path d="M15 6h4v4"/></svg>Progreso</button>
  <button data-act="tab" data-tab="tasks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>Tareas</button>
</div></nav>

<div id="overlay" class="overlay" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" hidden></div>
<input type="file" id="fileImport" accept="application/json,.json" hidden>
<input type="file" id="filePhoto" accept="image/*" capture="environment" hidden>

<script src="https://cdn.jsdelivr.net/npm/barcode-detector@3.2.2/dist/iife/ponyfill.js"></script>
<script>
(function(){
"use strict";
/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const today=()=>ymd(new Date());
const wd=s=>{const g=parse(s).getDay();return g===0?7:g};
const monday=s=>addDays(s,1-wd(s));
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const slug=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"ejercicio";
const nf=(n,d=0)=>Number(n||0).toLocaleString("es-ES",{maximumFractionDigits:d,minimumFractionDigits:0});
const num=v=>{const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:0};
const MES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

const EMPTY_DAY=()=>({foods:[],water:0,steps:0,extra:[]});
function nutRead(date){const m=docs["n-"+date.slice(0,7)];const d=m&&m.days&&m.days[date.slice(8)];return Object.assign(EMPTY_DAY(),d||{})}
function nut(date){const m=ensure("n-"+date.slice(0,7),()=>({days:{}}));m.days=m.days||{};const k=date.slice(8);const d=m.days[k]||(m.days[k]=EMPTY_DAY());d.foods=d.foods||[];d.extra=d.extra||[];return d}

/* ---------- cálculos ---------- */
function foodVals(f){const g=num(f.g)/100;return {kcal:num(f.k100)*g,p:num(f.p100)*g,c:num(f.c100)*g,f:num(f.f100)*g}}
function totals(date){
  const d=nutRead(date),t={kcal:0,p:0,c:0,f:0};
  d.foods.forEach(x=>{const v=foodVals(x);t.kcal+=v.kcal;t.p+=v.p;t.c+=v.c;t.f+=v.f});
  const w=weightOn(date),stepsK=Math.round(num(d.steps)*w*0.0005);
  const extraK=d.extra.reduce((a,e)=>a+num(e.kcal),0);
  return Object.assign(t,{water:num(d.water),steps:num(d.steps),stepsK,extraK,burned:stepsK+extraK,net:Math.round(t.kcal-stepsK-extraK),w});
}
function allSessions(){
  const out={};
  Object.keys(docs).filter(k=>/^g-\d{4}-\d{2}$/.test(k)).forEach(k=>{
    const ym=k.slice(2),days=(docs[k]&&docs[k].days)||{};
    Object.keys(days).forEach(dd=>{
      const ex=(days[dd]&&days[dd].ex)||{};
      Object.keys(ex).forEach(key=>{
        const e=ex[key];const sets=(e.sets||[]).filter(s=>num(s.r)>0);
        if(!sets.length&&!(e.note||"").trim())return;
        (out[key]=out[key]||[]).push({date:ym+"-"+dd,name:e.name,type:e.type||"peso",sets,note:(e.note||"").trim()});
      });
    });
  });
  Object.values(out).forEach(a=>a.sort((x,y)=>x.date<y.date?-1:1));
  return out;
}
function metric(s){
  if(!s||!s.sets.length)return null;
  if(s.type==="peso"){const w=s.sets.filter(x=>num(x.w)>0);if(w.length)return {v:Math.max(...w.map(x=>num(x.w)*(1+num(x.r)/30))),u:"kg (1RM est.)"}}
  return {v:s.sets.reduce((a,x)=>a+num(x.r),0),u:s.type==="tiempo"?"min":"reps totales"};
}
function fmtSets(s){
  if(!s||!s.sets.length)return "";
  if(s.type==="tiempo")return s.sets.map(x=>nf(x.r)+" min").join(" · ");
  if(s.type==="reps")return s.sets.map(x=>nf(x.r)).join(" · ")+" reps";
  const ws=s.sets.map(x=>num(x.w));const same=ws.every(w=>w===ws[0]);
  if(same&&ws[0]>0)return nf(ws[0],2)+" kg × "+s.sets.map(x=>nf(x.r)).join(" · ");
  return s.sets.map(x=>(num(x.w)>0?nf(x.w,2)+"×":"")+nf(x.r)).join(" · ");
}
function pctOf(a,b){return a>0?(b-a)/a*100:null}
function monthSummary(ym,all){
  all=all||allSessions();const res=[];
  Object.keys(all).forEach(key=>{
    const ss=all[key].filter(s=>metric(s));
    const inM=ss.filter(s=>s.date.slice(0,7)===ym);if(!inM.length)return;
    const before=ss.filter(s=>s.date.slice(0,7)<ym);
    const base=before.length?before[before.length-1]:inM[0];const end=inM[inM.length-1];
    if(base===end)return;
    const a=metric(base),b=metric(end);const p=pctOf(a.v,b.v);if(p==null)return;
    res.push({key,name:end.name,p,a:a.v,b:b.v,u:b.u});
  });
  res.sort((x,y)=>y.p-x.p);
  return res;
}

function exCard(ex,i,date,log,all){

      :`<div class="set one"><span class="n">${j+1}</span><label><input type="number" inputmode="decimal" id="r-${key}-${j}" data-in="set" data-k="${i}" data-j="${j}" data-f="r" value="${s.r!=null&&s.r!==""?esc(s.r):""}" placeholder="${ph?nf(ph.r):"–"}" aria-label="${unit} serie ${j+1}"><em>${unit}</em></label><button class="x" data-act="delset" data-k="${i}" data-j="${j}" aria-label="Quitar serie">${ICON.x}</button></div>`;

  return `<section class="card ex">
    <div class="head"><div class="grow"><h4>${esc(ex.name)}${ex.extra?'<span class="src">solo este día</span>':""}</h4>${ex.hint?`<div class="hint">${esc(ex.hint)}</div>`:""}</div><span class="target">${esc(ex.sets)} × ${esc(ex.reps)}${type==="tiempo"?" min":""}</span><button class="x" data-act="rmex" data-k="${i}" aria-label="Quitar ejercicio" style="margin:-4px -6px 0 0">${ICON.x}</button></div>
    <div class="last">${last?`<span class="lbl" style="letter-spacing:.06em">Última vez · ${fmtShort(last.date)}</span><br><b>${esc(fmtSets(last))}</b>`:`<span class="muted">Primera vez: hoy marcas la referencia.</span>`}
      ${lastNote?`<div class="note small">Nota del ${fmtShort(lastNote.date)}: ${esc(lastNote.note)}</div>`:""}</div>
    <div class="sets">${setsHtml}</div>
    <div class="row wrap between" style="margin-top:8px"><div class="row"><button class="btn sm ghost" data-act="addset" data-k="${i}">${ICON.plus}Serie</button>${last?`<button class="btn sm ghost" data-act="copylast" data-k="${i}">Repetir última</button>`:""}</div>${cmp}</div>

/* ----- Progreso ----- */
function lineChart(pts,color,unit,dec){
  if(pts.length<2)return `<div class="empty small">Añade al menos dos registros para ver la gráfica.</div>`;
  const W=320,H=140,L=38,R=10,T=12,B=24;
  const ys=pts.map(p=>p.y);let mn=Math.min(...ys),mx=Math.max(...ys);if(mn===mx){mn-=1;mx+=1}const padv=(mx-mn)*.12;mn-=padv;mx+=padv;
  const t0=parse(pts[0].x).getTime(),t1=parse(pts[pts.length-1].x).getTime()||t0+1;
  const X=x=>L+(W-L-R)*((parse(x).getTime()-t0)/Math.max(1,t1-t0)),Y=y=>T+(H-T-B)*(1-(y-mn)/(mx-mn));
  const d=pts.map((p,i)=>(i?"L":"M")+X(p.x).toFixed(1)+" "+Y(p.y).toFixed(1)).join(" ");
  const area=d+` L${X(pts[pts.length-1].x).toFixed(1)} ${H-B} L${L} ${H-B} Z`;
  const ticks=[mn+(mx-mn)*.15,(mn+mx)/2,mx-(mx-mn)*.15];
  const lp=pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución en ${unit}">
    ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${nf(v,dec)}</text>`).join("")}
    <path d="${area}" fill="${color}" opacity=".12"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(p=>`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="2.4" fill="${color}"/>`).join("")}
    <circle cx="${X(lp.x)}" cy="${Y(lp.y)}" r="4.5" fill="var(--surface)" stroke="${color}" stroke-width="2.4"/>
    <text x="${L}" y="${H-6}" font-size="10" fill="var(--muted)">${fmtShort(pts[0].x)}</text><text x="${W-R}" y="${H-6}" font-size="10" text-anchor="end" fill="var(--muted)">${fmtShort(lp.x)}</text>
  </svg>`;
}
function spark(vals){
  if(vals.length<2)return "";
  const W=70,H=22,mn=Math.min(...vals),mx=Math.max(...vals)||1,rg=mx-mn||1;
  const d=vals.map((v,i)=>(i?"L":"M")+(i/(vals.length-1)*(W-4)+2).toFixed(1)+" "+(H-3-(v-mn)/rg*(H-6)).toFixed(1)).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true"><path d="${d}" fill="none" stroke="var(--muted)" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
}

  const body=bodyEntries();const lastB=body[body.length-1],firstB=body[0];

  const fPts=body.filter(e=>num(e.bf)>0).map(e=>({x:e.date,y:num(e.bf)}));
  const delta=(pts,u,dec)=>pts.length>1?(()=>{const dlt=pts[pts.length-1].y-pts[0].y;return `<span class="pctpill ${dlt>0?"up":dlt<0?"down":"flat"}" style="background:var(--sunk);color:var(--ink)">${dlt>0?"+":""}${nf(dlt,dec)} ${u} desde el inicio</span>`})():"";
  const notes=[];Object.values(all).forEach(a=>a.forEach(s=>{if(s.note)notes.push(s)}));
  Object.keys(docs).filter(k=>/^g-\d{4}-\d{2}$/.test(k)).forEach(k=>{const days=(docs[k]&&docs[k].days)||{};Object.keys(days).forEach(dd=>{const n=(days[dd].note||"").trim();if(n)notes.push({date:k.slice(2)+"-"+dd,name:"Nota del día",note:n,day:true})})});

  return `<div class="datenav"><div><h2>Progreso</h2><div class="sub">Desde tu primer registro</div></div></div>
  <div class="stack">
  <section class="card"><div class="row between"><span class="lbl">Resumen mensual</span>
    <select id="pmonth" data-in="pmonth" style="width:auto;min-height:36px;padding:4px 10px">${mlist.map(m=>{const [y,mm]=m.split("-");return `<option value="${m}" ${m===ui.pmonth?"selected":""}>${MES[+mm-1]} ${y}</option>`}).join("")}</select></div></section>

    ${body.length?`<details style="margin-top:10px"><summary class="small muted" style="cursor:pointer">Todos los registros (${body.length})</summary><div class="list" style="margin-top:6px">${body.slice().reverse().map(e=>`<div class="item"><div class="grow">${fmtShort(e.date)} ${e.date.slice(0,4)}</div><span class="kc">${e.weight?nf(e.weight,1)+" kg":"–"}</span><span class="kc muted" style="min-width:60px;text-align:right">${e.bf?nf(e.bf,1)+" %":"–"}</span><button class="x" data-act="delbody" data-id="${e.id}" aria-label="Borrar">${ICON.x}</button></div>`).join("")}</div></details>`:""}

    ${rows.length?`<div class="scroll"><table class="tbl"><thead><tr><th>Ejercicio</th><th class="r">Inicio → Ahora</th><th class="r">Mejora</th></tr></thead><tbody>

function viewTasks(){

  </div>`;
}

let scanStream=null,scanTimer=null,scanning=false,detector=null,frameN=0;
const scanCanvas=document.createElement("canvas");
function stopScan(){scanning=false;clearTimeout(scanTimer);if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}}
async function getDetector(){
  if(detector)return detector;
  const want=["ean_13","ean_8","upc_a","upc_e"];
  if("BarcodeDetector" in window){try{const sup=await window.BarcodeDetector.getSupportedFormats();const f=want.filter(x=>sup.includes(x));if(f.length){detector=new window.BarcodeDetector({formats:f});return detector}}catch(e){}}
  if(window.BarcodeDetectionAPI&&window.BarcodeDetectionAPI.BarcodeDetector){detector=new window.BarcodeDetectionAPI.BarcodeDetector({formats:want});return detector}
  return null;
}
function pickCode(res){const h=(res||[]).find(r=>/^\d{8,14}$/.test(String(r.rawValue||"")));return h?String(h.rawValue):null}
function gotCode(code){if(!scanning&&!$("#scanVideo"))return;stopScan();if(navigator.vibrate)navigator.vibrate(60);lookupCode(code)}
async function scanLoop(){
  if(!scanning)return;
  const v=$("#scanVideo");
  if(v&&v.readyState>=2&&v.videoWidth){
    const vw=v.videoWidth,vh=v.videoHeight;frameN++;
    /* alterna: franja central ampliada (más rápida y nítida) y fotograma completo */
    let sx=0,sy=0,cw=vw,ch=vh;
    if(frameN%2){cw=Math.round(vw*.9);ch=Math.round(vh*.45);sx=(vw-cw)/2;sy=(vh-ch)/2}
    const k=Math.min(1,1600/Math.max(cw,ch));
    scanCanvas.width=Math.round(cw*k);scanCanvas.height=Math.round(ch*k);
    scanCanvas.getContext("2d",{willReadFrequently:true}).drawImage(v,sx,sy,cw,ch,0,0,scanCanvas.width,scanCanvas.height);
    try{const code=pickCode(await detector.detect(scanCanvas));if(code&&scanning){gotCode(code);return}}catch(e){}
  }
  scanTimer=setTimeout(scanLoop,90);
}
async function openScanner(){
  openSheet(`<div class="row between"><h3>Escanear</h3><button class="x" data-act="close" aria-label="Cerrar">${ICON.x}</button></div>
  <div class="scanbox"><video id="scanVideo" playsinline muted autoplay></video><div class="ret"></div></div>
  <div class="row" id="zoomRow" hidden><span class="small muted">Zoom</span><input type="range" id="zoom" class="grow"></div>
  <div class="status" id="scanMsg">Abriendo cámara…</div>
  <div class="row wrap"><button class="btn grow" data-act="photocode">${ICON.cam}Hacer foto del código</button></div>
  <div class="row"><input type="text" inputmode="numeric" id="manualCode" placeholder="O escribe el número del código" class="grow"><button class="btn" data-act="manualcode">Buscar</button></div>`,stopScan);
  const msg=$("#scanMsg");const fail=t=>{msg.className="status err";msg.textContent=t};
  const det=await getDetector();
  if(!det){fail("No se ha podido cargar el lector. Revisa la conexión y vuelve a abrir el escáner, o escribe el código.");return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){fail("Este navegador no deja usar la cámara aquí. Usa “Hacer foto del código” o escríbelo.");return}
  try{scanStream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}}})}
  catch(err){fail(err&&err.name==="NotAllowedError"?"Sin permiso para la cámara. Actívalo en Ajustes › Safari › Cámara (o al abrir la app), o usa la foto.":"No se pudo abrir la cámara. Usa “Hacer foto del código” o escríbelo.");return}
  const v=$("#scanVideo");if(!v){stopScan();return}
  v.srcObject=scanStream;try{await v.play()}catch(e){}
  const track=scanStream.getVideoTracks()[0];
  try{const caps=track.getCapabilities?track.getCapabilities():{};
    if(caps.focusMode&&caps.focusMode.includes("continuous"))await track.applyConstraints({advanced:[{focusMode:"continuous"}]});
    if(caps.zoom&&caps.zoom.max>caps.zoom.min){const z=$("#zoom");z.min=caps.zoom.min;z.max=Math.min(caps.zoom.max,5);z.step=caps.zoom.step||.1;
      const start=Math.min(+z.max,Math.max(caps.zoom.min,1.6));z.value=start;try{await track.applyConstraints({advanced:[{zoom:start}]})}catch(e){}
      z.oninput=()=>{track.applyConstraints({advanced:[{zoom:+z.value}]}).catch(()=>{})};$("#zoomRow").hidden=false}
  }catch(e){}
  msg.className="status";msg.textContent="Pon el código dentro del recuadro, a unos 15-20 cm. Si sale borroso, aléjalo un poco.";
  scanning=true;frameN=0;scanLoop();
}

async function fetchOFF(code){
  const r=await fetch("https://world.openfoodfacts.org/api/v2/product/"+encodeURIComponent(code)+".json?fields=product_name,product_name_es,generic_name_es,brands,nutriments,serving_quantity,quantity");
  if(!r.ok&&r.status!==404)throw new Error("net");
  const j=await r.json();
  if(!j||j.status!==1||!j.product)return null;
  return offToProduct(j.product,code);
}

function offToProduct(p,code){
  const n=p.nutriments||{};
  let kcal=n["energy-kcal_100g"];if(kcal==null&&n.energy_100g!=null)kcal=n.energy_100g/4.184;
  const r1=v=>v==null||!isFinite(+v)?null:Math.round(+v*10)/10;
  const brands=Array.isArray(p.brands)?p.brands:TXT(p.brands).split(",");
  return {code:String(code||p.code||""),name:(TXT(p.product_name_es)||TXT(p.product_name)||TXT(p.generic_name_es)).trim(),brand:String(brands[0]||"").trim(),
    cat:TXT(p.categories)+" "+tagsEs(p.categories_tags)+" "+TXT(p.generic_name_es),

    kcal:r1(kcal),p:r1(n.proteins_100g),c:r1(n.carbohydrates_100g),f:r1(n.fat_100g),serving:r1(p.serving_quantity),src:"off"};
}
async function lookupCode(code){
  code=String(code).replace(/\D/g,"");if(code.length<6){toast("Ese código no parece válido");return}
  const known=findByCode(code);
  if(known){closeSheet();openGrams(known.id);return}
  if($("#overlay").hidden)openSheet(`<h3>Buscando…</h3><div class="status">Código ${esc(code)}</div>`);
  else $("#sheet").innerHTML=`<h3>Buscando producto…</h3><div class="status">Código ${esc(code)} en Open Food Facts</div>`;
  let p=null,netErr=false;
  try{p=await fetchOFF(code)}catch(e){netErr=true}
  if(p&&p.name&&p.kcal!=null){
    const items=products();const id="c"+code;
    items[id]=Object.assign({},p,{id,p:p.p||0,c:p.c||0,f:p.f||0});save("products");
    gramsProd=items[id];$("#sheet").innerHTML=gramsSheet(items[id]);updGramsPrev();
    sheetClose=null;
  }else if(p){
    $("#sheet").innerHTML=prodForm(Object.assign({},p),"Encontrado, pero le faltan datos nutricionales. Complétalos una vez y queda guardado.",true);
  }else{
    if(netErr)$("#sheet").innerHTML=prodForm({code},"Sin conexión con Open Food Facts. Rellénalo a mano o inténtalo luego.",true);
    else{closeSheet();openSearch(code,"")}
  }
}

const NORM=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g," ").trim();
const STOP=new Set(["de","del","la","el","los","las","y","con","en","al","a","sin"]);
function stem(w){w=w.replace(/ces$/,"z");if(w.length>3)w=w.replace(/s$/,"");if(w.length>3)w=w.replace(/[aeo]$/,"");return w}
function matcher(q){
  const toks=NORM(q).split(" ").filter(t=>t&&!STOP.has(t)).map(stem);
  return text=>{
    if(!toks.length)return -1;
    const words=NORM(text).split(" ").filter(Boolean).map(stem);let score=0;
    for(const t of toks){let best=-1;
      words.forEach((w,j)=>{if(w===t)best=Math.max(best,j===0?6:4);else if(w.startsWith(t))best=Math.max(best,j===0?3:2)});
      if(best<0)return -1;score+=best}
    return score;
  };
}

function dropStores(q){return NORM(q).split(" ").filter(t=>!STORES[t]&&!Object.values(STORES).includes(t)).join(" ")}

  const scored=list.map((x,ix)=>{
    const words=NORM(textOf(x)).split(" ").filter(Boolean).map(stem);
    const nameW=NORM(x.name).split(" ").filter(Boolean).map(stem);
    const bw=NORM(brandOf(x)).split(" ").filter(Boolean).map(stem);
    if(brandT.some(b=>!bw.some(w=>w.startsWith(b))&&!words.some(w=>w===b)))return null;
    let m=0,sc=0;
    plain.forEach(t=>{
      const hit=w=>w===t||w.startsWith(t)||(t.length>=4&&w.includes(t));
      if(nameW.some(hit)){m++;sc+=nameW[0]&&hit(nameW[0])?6:4}
      else if(words.some(hit)){m++;sc+=1}
    });
    if(plain.length&&m===0)return null;
    const full=m===plain.length;
    return {x,full,s:(full?1000:0)+m*20+sc+(x.es?30:0)-ix*0.01};
  }).filter(Boolean).sort((a,b)=>b.s-a.s);
  const fulls=scored.filter(o=>o.full);
  const parts=scored.filter(o=>!o.full).slice(0,Math.max(0,30-fulls.length));
  return fulls.concat(parts).map(o=>o.x);
}
function rank(list,q,textOf){const m=matcher(q);return list.map(x=>({x,s:m(textOf(x))})).filter(o=>o.s>=0).sort((a,b)=>b.s-a.s).map(o=>o.x)}

const OFF_FIELDS="code,product_name,product_name_es,generic_name_es,brands,categories,categories_tags,countries_tags,nutriments,serving_quantity";
async function salFetch(q,page,spain,signal){
  const words=NORM(q).split(" ").filter(t=>t&&!STOP.has(t));
  const base=words.length>1?words.join(" AND "):words.join("");
  const qq=spain?"("+base+") AND countries_tags:\"en:spain\"":base;
  const r=await fetch("https://search.openfoodfacts.org/search?q="+encodeURIComponent(qq)+"&langs=es&page_size=100&page="+page+"&fields="+OFF_FIELDS,{signal});
  if(!r.ok)throw new Error("sal "+r.status);const j=await r.json();
  const list=(j.hits||[]).map(x=>offToProduct(x,x.code));if(spain)list.forEach(x=>x.es=true);
  return {list,more:(j.page_count||0)>page};
}
async function legacyFetch(q,page,spain,signal){
  const u="https://es.openfoodfacts.org/cgi/search.pl?action=process&json=1&search_simple=1&page_size=100&page="+page+"&fields="+OFF_FIELDS+"&search_terms="+encodeURIComponent(q)+(spain?"&tagtype_0=countries&tag_contains_0=contains&tag_0=spain":"");
  const r=await fetch(u,{signal});if(!r.ok)throw new Error("legacy "+r.status);const j=await r.json();
  const list=(j.products||[]).map(x=>offToProduct(x,x.code));if(spain)list.forEach(x=>x.es=true);
  return {list,more:(j.count||0)>page*100};
}
async function offSearch(q,page){
  const ctl=new AbortController();fs.ctl=ctl;
  const sq=storeQ(q);
  const codes=new Set(Object.values(products()).map(p=>p.code).filter(Boolean));
  const ok=x=>x.name&&x.kcal!=null&&x.kcal<=900;
  const clean=list=>relaxedRank(list.filter(ok),sq,x=>x.name+" "+x.brand+" "+x.cat,x=>x.brand).filter(x=>{const k=x.code||NORM(x.name+" "+x.brand);if(fs.seen.has(k)||codes.has(x.code))return false;fs.seen.add(k);return true});
  try{
    const jobs=[salFetch(sq,page,true,ctl.signal),legacyFetch(sq,page,true,ctl.signal),salFetch(sq,page,false,ctl.signal),legacyFetch(sq,page,false,ctl.signal)];
    const rs=await Promise.allSettled(jobs);
    if(fs.ctl!==ctl)return;
    let out=[],more=false,anyOk=false;
    rs.forEach(r=>{if(r.status==="fulfilled"){anyOk=true;out=out.concat(r.value.list);more=more||r.value.more}});
    const res=clean(out);
    if(!anyOk)throw new Error("net");
    fs.o=fs.o.concat(res);fs.more=more;fs.page=page;fs.total=fs.o.length;
    fs.status=fs.o.length?"":(fs.h.length||fs.b.length?"No hay productos de marca con ese nombre.":"Sin resultados. Prueba con otra palabra, escanea el código o créalo a mano.");
  }catch(e){if(e&&e.name==="AbortError")return;fs.status="No se pudo conectar con la base de datos de productos. Revisa la conexión.";}
  fs.ctl=null;drawResults();
}

  addfood(a){const p=products()[a.dataset.id];const g=num($("#g_in").value);if(!p||!g)return;
    addEntry(p,g);closeSheet();toast("Añadido: "+(unitTxt(p.unit,g)||nf(g)+" g · ")+p.name)},
  editfood(a){const f=nut(ui.date).foods.find(x=>x.id===a.dataset.id);if(f)openGrams(f.pid,f)},
  savefood(a){const f=nut(ui.date).foods.find(x=>x.id===a.dataset.id);const g=num($("#g_in").value);if(f&&g){f.g=g;nutSave(ui.date)}closeSheet()},
  delfood(a){const d=nut(ui.date);const i=d.foods.findIndex(x=>x.id===a.dataset.id);if(i<0)return;const [it]=d.foods.splice(i,1);nutSave(ui.date);render();const dt=ui.date;toast("Quitado: "+it.name,()=>{nut(dt).foods.splice(i,0,it);nutSave(dt)})},
  /* gimnasio */
  week(a){ui.week=addDays(ui.week,+a.dataset.n);render()},
  thisweek(){ui.week=monday(today());ui.gday=wd(today());render()},
  gday(a){ui.gday=+a.dataset.n;render()},
  edit(){ui.edit=!ui.edit;render()},
  addset(a){const date=addDays(ui.week,ui.gday-1),ex=curItems()[+a.dataset.k];const e=gymEx(date,ex);const rows=Math.max(e.sets.length,num(ex.sets)||1);while(e.sets.length<rows)e.sets.push({w:"",r:""});e.sets.push({w:"",r:""});gymSave(date);render()},
  delset(a){const date=addDays(ui.week,ui.gday-1),ex=curItems()[+a.dataset.k];const e=gymEx(date,ex);const rows=Math.max(e.sets.length,num(ex.sets)||1);while(e.sets.length<rows)e.sets.push({w:"",r:""});e.sets.splice(+a.dataset.j,1);gymSave(date);render()},
  copylast(a){const date=addDays(ui.week,ui.gday-1),ex=curItems()[+a.dataset.k];const k=slug(ex.name);const hist=(allSessions()[k]||[]).filter(s=>s.date<date&&s.sets.length);const last=hist[hist.length-1];if(!last)return;const e=gymEx(date,ex);e.sets=last.sets.map(s=>({w:s.w,r:s.r}));gymSave(date);render()},
  addexday(){
    const known=[...new Set(Object.values(routine()).flatMap(d=>(d.items||[]).map(x=>x.name)).concat(Object.values(allSessions()).map(a=>a[a.length-1].name)))].sort((a,b)=>a.localeCompare(b,"es"));
    openSheet(`<div class="row between"><h3>Añadir ejercicio</h3><button class="x" data-act="close" aria-label="Cerrar">${ICON.x}</button></div>
    <div class="field"><label class="lbl" for="nx_name">Ejercicio</label><input type="text" id="nx_name" list="nx_list" placeholder="Escribe o elige uno que ya hayas hecho" autofocus><datalist id="nx_list">${known.map(n=>`<option value="${esc(n)}"></option>`).join("")}</datalist></div>
    <div class="editrow" style="border:0;padding:0"><div class="mini"><input type="number" inputmode="numeric" id="nx_sets" value="3" aria-label="Series"><input type="text" id="nx_reps" value="8-12" aria-label="Repeticiones objetivo">
      <select id="nx_type" aria-label="Tipo"><option value="peso">Peso + reps</option><option value="reps">Solo reps</option><option value="tiempo">Minutos</option></select></div></div>
    <div class="lbl">¿Dónde lo añado?</div>
    <div class="row wrap"><button class="btn primary grow" data-act="addexsave" data-scope="routine">Todos los ${DLONG[ui.gday-1].toLowerCase()}</button><button class="btn grow" data-act="addexsave" data-scope="day">Solo el ${fmtShort(curDate())}</button></div>
    <p class="small muted" style="margin:0">Si usas el mismo nombre que un ejercicio que ya has hecho, verás tu última marca y su progreso.</p>`)},
  addexsave(a){const name=$("#nx_name").value.trim();if(!name){$("#nx_name").focus();return}
    const it={id:uid(),name,sets:num($("#nx_sets").value)||3,reps:$("#nx_reps").value.trim()||"8-12",type:$("#nx_type").value,hint:""};
    const date=curDate();const d=gymDayRead(date);
    if(d.skip&&d.skip.includes(slug(name))){const g=gymDay(date);g.skip=g.skip.filter(x=>x!==slug(name));gymSave(date)}
    if(a.dataset.scope==="routine"){routineEnsure(ui.gday).items.push(it);save("routine")}
    else{const g=gymDay(date);g.extra=g.extra||[];g.extra.push(it);gymSave(date)}
    closeSheet();toast("Añadido: "+name)},
  rmex(a){const ex=curItems()[+a.dataset.k];if(!ex)return;const date=curDate();
    if(ex.extra){const g=gymDay(date);const i=(g.extra||[]).findIndex(x=>x.id===ex.id);if(i<0)return;const [it]=g.extra.splice(i,1);gymSave(date);render();toast("Quitado: "+ex.name,()=>{gymDay(date).extra.splice(i,0,it);gymSave(date)});return}
    openSheet(`<div class="row between"><h3>Quitar ejercicio</h3><button class="x" data-act="close" aria-label="Cerrar">${ICON.x}</button></div>
    <p style="margin:0;font-weight:600">${esc(ex.name)}</p>
    <button class="btn" data-act="rmexday" data-k="${a.dataset.k}">Solo este día (${fmtShort(date)})</button>
    <button class="btn primary" data-act="rmexroutine" data-k="${a.dataset.k}">De todos los ${DLONG[ui.gday-1].toLowerCase()}</button>
    <p class="small muted" style="margin:0">Lo que ya registraste de este ejercicio se conserva en tu historial y en Progreso.</p>`)},
  rmexday(a){const ex=curItems()[+a.dataset.k];if(!ex)return;const date=curDate();const g=gymDay(date);g.skip=g.skip||[];g.skip.push(slug(ex.name));gymSave(date);closeSheet();
    toast("Quitado solo este día",()=>{const gg=gymDay(date);gg.skip=(gg.skip||[]).filter(x=>x!==slug(ex.name));gymSave(date)})},
  rmexroutine(a){const ex=curItems()[+a.dataset.k];if(!ex)return;const d=routineEnsure(ui.gday);const i=d.items.findIndex(x=>x.id===ex.id);if(i<0)return;const [it]=d.items.splice(i,1);save("routine");closeSheet();const n=ui.gday;
    toast("Quitado de la rutina",()=>{routineEnsure(n).items.splice(i,0,it);save("routine")})},
  addex(){const d=routineEnsure(ui.gday);d.items=d.items||[];d.items.push({id:uid(),name:"Nuevo ejercicio",sets:3,reps:"8-12",type:"peso",hint:""});save("routine");render();setTimeout(()=>{const el=$("#en-"+(d.items.length-1));if(el){el.focus();el.select()}},50)},
  delex(a){const d=routineEnsure(ui.gday);const i=+a.dataset.k;const [it]=d.items.splice(i,1);save("routine");render();const n=ui.gday;toast("Ejercicio quitado de la rutina (su historial se conserva)",()=>{routineEnsure(n).items.splice(i,0,it);save("routine")})},
  mv(a){const d=routineEnsure(ui.gday);const i=+a.dataset.k,j=i+ +a.dataset.n;if(j<0||j>=d.items.length)return;[d.items[i],d.items[j]]=[d.items[j],d.items[i]];save("routine");render()},
  /* progreso */
  addbody(){const w=num($("#bw").value),f=num($("#bf").value),dt=$("#bdate").value||today();if(!w&&!f){$("#bw").focus();return}
    const b=ensure("body",()=>({entries:[]}));b.entries=b.entries||[];const ex=b.entries.find(e=>e.date===dt);
    if(ex){if(w)ex.weight=w;if(f)ex.bf=f}else b.entries.push({id:uid(),date:dt,weight:w||null,bf:f||null});save("body");render();toast("Registro guardado")},
  delbody(a){const b=docs.body;if(!b)return;const i=b.entries.findIndex(e=>e.id===a.dataset.id);if(i<0)return;const [it]=b.entries.splice(i,1);save("body");render();toast("Registro borrado",()=>{docs.body.entries.splice(i,0,it);save("body")})},
  /* tareas */
  addtask(){const t=$("#tnew").value.trim();if(!t){$("#tnew").focus();return}tasks().push({id:uid(),text:t,date:$("#tdate").value||ui.date,done:false});save("tasks");render();setTimeout(()=>{const el=$("#tnew");if(el)el.focus()},30)},
  toggletask(a){const x=tasks().find(t=>t.id===a.dataset.id);if(!x)return;x.done=!x.done;x.doneOn=x.done?ui.date:null;save("tasks");render()},
  deltask(a){const all=tasks();const i=all.findIndex(t=>t.id===a.dataset.id);if(i<0)return;const [it]=all.splice(i,1);save("tasks");render();toast("Tarea borrada",()=>{tasks().splice(i,0,it);save("tasks")})}
};
document.addEventListener("click",e=>{const a=e.target.closest("[data-act]");if(!a)return;if(a.tagName==="A")e.preventDefault();const f=ACT[a.dataset.act];if(f)f(a,e)});

/* ---------- entradas ---------- */
const IN={
  fs(el){doSearch(el.value)},
  q(el){ui.q=el.value;const pos=el.selectionStart;render();const n=$("#q");if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}},
  steps(el){const d=nut(ui.date);d.steps=num(el.value);nutSave(ui.date)},
  grams(){updGramsPrev()},
  set(el){const date=addDays(ui.week,ui.gday-1),ex=curItems()[+el.dataset.k];if(!ex)return;const e=gymEx(date,ex);e.type=ex.type||"peso";e.name=ex.name;const j=+el.dataset.j;const rows=Math.max(e.sets.length,num(ex.sets)||1);while(e.sets.length<Math.max(rows,j+1))e.sets.push({w:"",r:""});e.sets[j][el.dataset.f]=el.value===""?"":num(el.value);gymSave(date)},
  note(el){const date=addDays(ui.week,ui.gday-1),ex=curItems()[+el.dataset.k];if(!ex)return;const e=gymEx(date,ex);e.note=el.value;gymSave(date)},
  daynote(el){const date=curDate();gymDay(date).note=el.value;gymSave(date)},
  rtitle(el){routineEnsure(ui.gday).title=el.value;save("routine")},
  rnote(el){routineEnsure(ui.gday).note=el.value;save("routine")},
  ename(el){routineEnsure(ui.gday).items[+el.dataset.k].name=el.value;save("routine")},
  esets(el){routineEnsure(ui.gday).items[+el.dataset.k].sets=num(el.value)||1;save("routine")},
  ereps(el){routineEnsure(ui.gday).items[+el.dataset.k].reps=el.value;save("routine")},
  etype(el){routineEnsure(ui.gday).items[+el.dataset.k].type=el.value;save("routine")},
  ehint(el){routineEnsure(ui.gday).items[+el.dataset.k].hint=el.value;save("routine")},
  pmonth(el){ui.pmonth=el.value;render()}
};
document.addEventListener("input",e=>{const el=e.target;if(!el.dataset||!el.dataset.in)return;if(el.dataset.in==="pmonth"||el.dataset.in==="etype")return;const f=IN[el.dataset.in];if(f)f(el)});
document.addEventListener("change",e=>{const el=e.target;if(!el.dataset||!el.dataset.in)return;const k=el.dataset.in;
  if(k==="pmonth"||k==="etype"){IN[k](el);return}
  if(k==="steps"){requestRender()}
  if(k==="set"){requestRender()}
});
document.addEventListener("keydown",e=>{if(e.key!=="Enter")return;const id=e.target.id;
  if(id==="tnew"){e.preventDefault();ACT.addtask()}
  else if(id==="fsq"){e.preventDefault();e.target.blur()}
  else if(id==="exKcal"||id==="exLabel"){e.preventDefault();ACT.addextra()}
  else if(id==="g_in"){e.preventDefault();const b=$("#sheet [data-act=addfood],#sheet [data-act=savefood]");if(b)b.click()}
});
$("#fileImport").addEventListener("change",async e=>{
  const f=e.target.files&&e.target.files[0];e.target.value="";if(!f)return;
  try{const j=JSON.parse(await f.text());if(!j||j.app!=="diario-hierro"||!j.docs)throw 0;
    Object.keys(docs).forEach(k=>delete docs[k]);Object.assign(docs,j.docs);save("all");closeSheet();toast("Copia importada")}
  catch(err){toast("Ese archivo no es una copia del Diario de Hierro")}
});
/* al volver a la app, si ha cambiado el día, salta a hoy */
let lastToday=today();
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&today()!==lastToday){const old=lastToday;lastToday=today();if(ui.date===old)ui.date=lastToday;ui.week=monday(lastToday);ui.gday=wd(lastToday);render()}});

initStore();
})();
</script>
</body>
</html>
